name: afm_bridge
description: "Apple Foundation Models (on-device LLM) with an OpenAI-compatible API for Flutter on iOS and macOS."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AfmBridgePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AfmBridgePlugin
        sharedDarwinSource: true
