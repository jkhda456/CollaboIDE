<!doctype html>
<html lang="ko" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collabo IDE — Viewer</title>
  <!-- 파일 뷰어의 **보기 영역**만 그리는 페이지. 틀(파일명·뷰어 선택·복사·전체화면·
       검색창)은 네이티브(Flutter)가 그리고, 여기는 뷰어 플러그인이 그리는 자리다.
       트리·대화와는 다른 웹뷰다(대화는 index.html). -->
  <link href="./vendor/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
                 background: var(--bs-body-bg); }
    /* 보기 영역 = 페이지 전체. 뷰어가 className 을 갈아 끼워도 id 규칙은 남는다. */
    #viewer { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain;
              font-family: var(--bs-font-monospace); font-size: .82rem; }
    .viewer-msg { font-family: var(--bs-body-font-family); }
    #viewer.md-rendered { font-family: inherit; font-size: inherit; }
    /* text/hex: 패딩을 pre 에 두고(스크롤 컨테이너에는 두지 않음) pre 가 뷰어를
       가로·세로로 모두 채우게 한다. 이렇게 하면 가로/세로 스크롤바가 모두
       #viewer(스크롤 컨테이너)에 생겨, 가로 스크롤바가 항상 패널 맨 아래에
       고정되고 둘이 동시에 보인다. */
    #viewer pre { margin: 0; white-space: pre; display: inline-block;
                  min-width: 100%; min-height: 100%; box-sizing: border-box;
                  padding: .5rem .6rem; }

    /* 대용량 파일 가상 스크롤(collaboViewers.virtualList). 전체 줄 수만큼 높이를
       잡아 두는 층(.vlist-body) 위에, 보이는 줄만 그리는 층(pre.vlist-layer)을
       띄운다. 스크롤은 #viewer 가 그대로 맡는다. */
    .vlist-body { position: relative; min-width: 100%; }
    /* 위아래 패딩은 두지 않는다 — 줄 위치를 top 으로 직접 잡으므로 패딩이 있으면
       스크롤 위치와 내용이 그만큼 어긋난다(좌우 여백은 그대로 둔다). */
    #viewer pre.vlist-layer { position: absolute; left: 0; top: 0; min-height: 0;
                              padding-top: 0; padding-bottom: 0; }
    /* 줄 높이를 재기 위한 눈금자 — 패딩 없이, 레이아웃에 영향 없이 잰다. */
    #viewer pre.vlist-probe { position: absolute; visibility: hidden; top: 0; left: 0;
                              padding: 0; min-height: 0; min-width: 0; }

    /* 압축 파일 뷰어: 머리말(형식·개수·검색) + 폴더 트리 + 항목 미리보기. */
    #viewer.archive-view { display: flex; flex-direction: column; overflow: hidden;
                           font-family: var(--bs-body-font-family); font-size: .82rem; }
    .archive-bar { flex: 0 0 auto; display: flex; align-items: center; gap: .5rem;
                   padding: .35rem .5rem;
                   border-bottom: 1px solid var(--bs-border-color); }
    .archive-filter { max-width: 220px; margin-left: auto; }
    #viewer.archive-view .alert { flex: 0 0 auto; border-radius: 0; }
    /* 목록만 스크롤한다. 미리보기가 열리면 목록이 줄어든다(둘 다 최소 높이 확보). */
    .archive-list { flex: 1 1 auto; min-height: 4rem; overflow: auto; }
    .archive-row { display: flex; align-items: center; gap: .25rem;
                   padding: .05rem .5rem .05rem 0; cursor: pointer;
                   white-space: nowrap; }
    .archive-row:hover { background: var(--bs-secondary-bg); }
    .archive-row.selected { background: var(--bs-primary-bg-subtle); }
    .archive-row.dir { font-weight: 500; }
    .archive-caret { width: 1em; flex: 0 0 auto; color: var(--bs-secondary-color); }
    .archive-name { overflow: hidden; text-overflow: ellipsis; }
    .archive-meta { margin-left: auto; padding-left: .75rem; flex: 0 0 auto;
                    font-size: .75rem; color: var(--bs-secondary-color);
                    font-family: var(--bs-font-monospace); }
    /* 미리보기: 뷰어 아래 절반까지 차지하고 그 안에서 스크롤한다. */
    .archive-preview { flex: 1 1 50%; min-height: 6rem; display: flex;
                       flex-direction: column;
                       border-top: 1px solid var(--bs-border-color); }
    .archive-preview.d-none { display: none !important; }
    .archive-preview-head { flex: 0 0 auto; display: flex; align-items: center;
                            gap: .5rem; padding: .25rem .5rem;
                            background: var(--bs-secondary-bg); }
    .archive-preview-name { overflow: hidden; text-overflow: ellipsis;
                            white-space: nowrap;
                            font-family: var(--bs-font-monospace); }
    .archive-preview-head .btn-close { margin-left: auto; }
    .archive-preview-body { flex: 1 1 0; min-height: 0; overflow: auto; }
    /* `#viewer pre` 규칙(id 선택자)을 이기려면 여기도 id 를 껴야 한다. */
    #viewer.archive-view .archive-preview-body pre {
      margin: 0; padding: .5rem .6rem; display: inline-block;
      min-width: 100%; box-sizing: border-box; min-height: 0;
      font-family: var(--bs-font-monospace); font-size: .8rem; white-space: pre;
    }

    /* 마크다운 편집기(뷰어 플러그인 예제): 툴바 + [편집 | 미리보기] 2단.
       #viewer 는 스크롤 컨테이너지만, 편집기는 자기 안에서 스크롤한다. */
    #viewer.md-editor { display: flex; flex-direction: column; overflow: hidden; }
    .md-editor-bar { flex: 0 0 auto; display: flex; align-items: center; gap: .5rem;
                     padding: .35rem .5rem;
                     border-bottom: 1px solid var(--bs-border-color); }
    .md-editor-state { font-size: .78rem; }
    .md-editor-warn { flex: 0 0 auto; border-radius: 0; }
    .md-editor-split { flex: 1 1 0; min-height: 0; display: flex; }
    .md-editor-input, .md-editor-preview { flex: 1 1 50%; min-width: 0; overflow: auto; }
    .md-editor-input { border: 0; border-right: 1px solid var(--bs-border-color);
                       resize: none; outline: none; padding: .5rem .6rem;
                       font-family: var(--bs-font-monospace); font-size: .82rem;
                       background: var(--bs-body-bg); color: var(--bs-body-color); }
    .md-editor-preview { padding: .5rem .8rem;
                         font-family: var(--bs-body-font-family); font-size: .9rem; }
    #viewer mark { background: #ffd54f; color: #000; padding: 0 1px; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="viewer" class="p-2"></div>

  <script src="./vendor/bootstrap.bundle.min.js"></script>
  <script src="./vendor/marked.min.js"></script>
  <!-- 뷰어 플러그인 목록(window.COLLABO_VIEWER_FILES). -->
  <script src="./viewers/index.js"></script>
  <script>
    // ===== Flutter ↔ Web 브리지 (대화 페이지와 같은 방식) =====
    function send(obj) {
      var json = JSON.stringify(obj);
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(json);
      } else if (window.Collabo && window.Collabo.postMessage) {
        window.Collabo.postMessage(json);
      }
    }
    function onBridge(data) {
      var msg;
      try { msg = typeof data === 'string' ? JSON.parse(data) : data; }
      catch (e) { return; }
      switch (msg.type) {
        // 네이티브 틀이 시키는 것
        case 'viewer.open': openFile(msg.path, msg.viewerId || null); break;
        case 'viewer.clear': clearViewer(); break;
        case 'viewer.find': searchQuery = msg.query || ''; applyViewerSearch(searchQuery); break;
        case 'viewer.copy': copySelection(); break;
        case 'fs.change': onFsChange(msg.files || []); break;
        // 요청의 응답
        case 'file.content': onFileContent(msg); break;
        case 'file.error': onFileError(msg); break;
        case 'file.saved': onFileSaved(msg); break;
        case 'file.windowData': onFileWindowData(msg); break;
        case 'viewer.assetData': onViewerAssetData(msg); break;
        case 'archive.entryData': onArchiveEntryData(msg); break;
      }
    }
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', function (e) { onBridge(e.data); });
    }
    window.collaboReceiveB64 = function (b64) {
      try {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        onBridge(new TextDecoder('utf-8').decode(bytes));
      } catch (e) { /* 손상된 메시지 무시 */ }
    };

    // 마우스 휠 우회(webview_windows 가 휠을 (0,0) 으로 보내는 버그) — 대화 페이지와 같다.
    var _wheelX = 0, _wheelY = 0;
    document.addEventListener('mousemove', function (e) {
      _wheelX = e.clientX; _wheelY = e.clientY;
    }, true);
    window.collaboWheel = function (dx, dy) {
      var el = document.elementFromPoint(_wheelX, _wheelY);
      while (el && el !== document.body) {
        var st = getComputedStyle(el);
        var canY = (st.overflowY === 'auto' || st.overflowY === 'scroll') &&
                   el.scrollHeight > el.clientHeight;
        var canX = (st.overflowX === 'auto' || st.overflowX === 'scroll') &&
                   el.scrollWidth > el.clientWidth;
        if (canY && dy !== 0) { el.scrollTop += dy; return; }
        if (canX && dx !== 0) { el.scrollLeft += dx; return; }
        el = el.parentElement;
      }
      window.scrollBy(dx, dy);
    };

    window.collaboSetTheme = function (mode) {
      document.documentElement.setAttribute('data-bs-theme', mode === 'dark' ? 'dark' : 'light');
    };

    // ===== 다국어: 네이티브가 대화 페이지와 같은 언어팩을 넘겨준다 =====
    var STR = {};
    function T(key, fallback) { return (STR && STR[key]) || fallback; }
    window.collaboSetStrings = function (dict) {
      STR = dict || {};
      // 비어 있는 상태의 안내 문구와 틀의 알림 줄은 언어팩 문구라 다시 만든다.
      if (!currentFilePath && !pendingOpenPath) showEmpty();
      reportState();
    };

    // ===== 유틸 =====
    function baseName(pth) { return (pth || '').split(/[\\/]/).filter(Boolean).pop() || pth; }
    function esc(s) {
      return (s || '').replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function extOf(pth) {
      var name = baseName(pth) || '';
      var i = name.lastIndexOf('.');
      return i > 0 ? name.slice(i).toLowerCase() : '';
    }
    function formatSize(n) {
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    // ===== 파일 뷰어 플러그인 레지스트리 =====
    // 뷰어 종류를 늘리는 방법은 viewers/index.js 주석 참고(계약도 거기 있다).
    // 스크립트 URL 정규화(절대화 + 쿼리/프래그먼트 제거).
    // 로드 시엔 캐시 무효화용 ?v=… 를 붙이지만, 추적/해제는 이 정규형으로 한다.
    function normViewerUrl(u) {
      try {
        var a = new URL(u, document.baseURI);
        a.search = ''; a.hash = '';
        return a.href;
      } catch (e) { return String(u || ''); }
    }

    // 네이티브가 읽어 줄 수 있는 데이터 형태. 새 형태를 늘리려면 네이티브
    // FileService(FileViewMode)에 먼저 추가해야 한다 — 웹은 파일을 직접 못 읽는다.
    var DATA_MODES = ['text', 'hex', 'archive'];

    // 지금 그려진 뷰어가 걸어 둔 구독을 끊는 함수(가상 스크롤의 scroll 리스너 등).
    // 다음 렌더 직전에 호출한다 — 뷰어는 몇 번이고 다시 그려지기 때문이다.
    var viewerCleanup = null;

    window.collaboViewers = (function () {
      var list = [];
      // 사용자 설정(설정 → 뷰어). 뷰어 id → {enabled, extensions|null}.
      // 플러그인이 선언한 값 위에 덮어쓴다. null 이면 선언값을 그대로 쓴다.
      var rules = Object.create(null);
      // 사용자가 정한 뷰어 우선순위(id 배열, 앞이 이긴다). 비면 등록 순서.
      var order = [];
      // 플러그인에 열어 주는 도우미. t 는 언어팩 조회(T)로, 뷰어도 다국어가 된다.
      var util = { esc: esc, baseName: baseName, extOf: extOf, t: T };

      function register(v) {
        if (!v || !v.id || typeof v.render !== 'function') {
          console.warn('[viewer] register 무시 — id/render 누락', v);
          return;
        }
        if (list.some(function (x) { return x.id === v.id; })) {
          console.warn('[viewer] 중복 id 무시:', v.id);
          return;
        }
        list.push({
          id: v.id,
          label: v.label || v.id,
          // 'text' | 'hex' | 'archive'(압축 목록 JSON). 모르는 값은 text 로.
          dataMode: DATA_MODES.indexOf(v.dataMode) !== -1 ? v.dataMode : 'text',
          extensions: (v.extensions || []).map(function (e) { return e.toLowerCase(); }),
          match: typeof v.match === 'function' ? v.match : null,
          render: v.render,
          // 어느 스크립트가 등록했는지. 설정에서 뷰어를 제거할 때 이걸로 찾아 내린다.
          // 최상위 실행 중이면 document.currentScript 가 그 <script> 다(비동기
          // 콜백 안에서 register 하면 null → 그 뷰어는 해제 대상에서 빠진다).
          src: normViewerUrl(document.currentScript && document.currentScript.src),
        });
      }

      /// 그 스크립트가 등록한 뷰어를 모두 목록에서 뺀다(제거된 개수 반환).
      function unregisterBySrc(src) {
        var key = normViewerUrl(src);
        if (!key) return 0;
        var before = list.length;
        list = list.filter(function (v) { return v.src !== key; });
        return before - list.length;
      }

      // ── 사용자 설정 적용 ────────────────────────────────────────────────
      // 켜짐 여부와 담당 확장자는 **설정이 우선**이고, 없으면 선언값을 쓴다.
      function isEnabled(v) {
        var r = rules[v.id];
        return !(r && r.enabled === false);
      }
      // override 가 있으면 그것. 빈 배열이면 "담당 확장자 없음" 이라는 뜻으로,
      // 아무도 담당하지 않는 파일의 폴백 후보로만 남는다(pick 참고).
      function extsOf(v) {
        var r = rules[v.id];
        return (r && r.extensions) ? r.extensions : v.extensions;
      }

      function setRules(map, orderIds) {
        var next = Object.create(null);
        Object.keys(map || {}).forEach(function (id) {
          var r = map[id] || {};
          next[id] = {
            enabled: r.enabled !== false,
            extensions: r.extensions
              ? r.extensions.map(function (e) { return String(e).toLowerCase(); })
              : null,
          };
        });
        rules = next;
        order = (orderIds || []).slice();
      }

      // 우선순위 = 사용자가 정한 순서(앞이 이김). 그 목록에 없는 뷰어는 뒤로 보내고,
      // 그들끼리는 등록 순서(= COLLABO_VIEWER_FILES 순서)를 유지한다.
      // (네이티브 sortViewersByOrder 와 같은 규칙이어야 한다 — 설정 화면의 표시
      //  순서가 곧 실제 선택 순서다.)
      function rankOf(v) {
        var i = order.indexOf(v.id);
        return i >= 0 ? i : order.length;
      }

      /// 쓸 수 있는 뷰어를 **우선순위 순으로** 돌려준다(드롭다운·자동 선택 대상).
      /// 꺼 둔 뷰어는 빠진다. (꺼 둔 것까지 필요한 곳은 report() 뿐이다.)
      function all() {
        // Array.prototype.sort 는 안정 정렬이라 동점이면 등록 순서가 유지된다.
        return list.filter(isEnabled).sort(function (a, b) {
          return rankOf(a) - rankOf(b);
        });
      }
      function get(id) {
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === id) return isEnabled(list[i]) ? list[i] : null;
        }
        return null;
      }

      // 파일 + 네이티브가 준 데이터 형태에 맞는 뷰어를 고른다.
      //
      // 후보 등급: 확장자 담당 > match() 통과 > 폴백(담당 확장자 없음).
      // **같은 등급 안에서는 목록 순서(all())대로 먼저 나온 뷰어가 이긴다** —
      // `.md` 를 Markdown 과 Markdown 편집기가 둘 다 담당하는 것처럼 중복은 흔하고,
      // 그때 누가 이길지는 사용자가 설정에서 정한다.
      //
      // **담당 확장자를 선언한 뷰어는 그 확장자에만 후보가 된다.** 그러지 않으면
      // 확장자가 안 맞아도 순서만으로 이겨 버린다(예: `.py` 를 열었는데 Markdown 이
      // 폴백 Text 를 눌러 마크다운으로 렌더링). 확장자를 비운 뷰어만 폴백이 된다.
      function pick(path, dataMode) {
        var ext = extOf(path);
        var info = { path: path, ext: ext, dataMode: dataMode };
        var byExt = null, byMatch = null, fallback = null;
        var usable = all();
        for (var i = 0; i < usable.length; i++) {
          var v = usable[i];
          if (v.dataMode !== dataMode) continue;
          var exts = extsOf(v);
          if (ext && exts.indexOf(ext) !== -1) {
            if (!byExt) byExt = v;
            continue;
          }
          if (v.match) {
            try {
              if (v.match(info)) { if (!byMatch) byMatch = v; continue; }
            } catch (e) { /* 무시 */ }
          }
          if (!exts.length && !fallback) fallback = v;
        }
        return byExt || byMatch || fallback;
      }

      /// 확장자를 담당하는 뷰어 중 우선순위가 가장 높은 것(데이터 형태는 안 본다).
      ///
      /// 파일을 **어떤 형태로 읽어 달라고 할지**를 정하기 위한 것이다. 네이티브도
      /// 자체 확장자 목록으로 text/hex 를 판정하는데, 그걸 그대로 두면 사용자가
      /// 설정한 확장자 연결(`.dat` → Text 뷰어)이 무시된다(hex 로 읽혀 온다).
      /// 담당 뷰어가 있으면 그 뷰어의 dataMode 로 요청하고, 없으면 네이티브 판정에
      /// 맡긴다(null).
      function pickByExt(path) {
        var ext = extOf(path);
        if (!ext) return null;
        var usable = all();
        for (var i = 0; i < usable.length; i++) {
          if (extsOf(usable[i]).indexOf(ext) !== -1) return usable[i];
        }
        return null;
      }

      // 등록 상태를 네이티브에 보고한다(설정 → 뷰어 화면이 이걸로 줄을 그린다).
      // 확장자는 **선언값**을 보낸다 — 설정 화면이 "기본값으로 되돌리기" 를
      // 보여 줄 수 있어야 한다(적용값은 네이티브가 rules 로 이미 알고 있다).
      var lastReport = '';
      function report() {
        var payload = list.map(function (v) {
          return {
            id: v.id,
            label: v.label,
            dataMode: v.dataMode,
            extensions: v.extensions,
            user: v.src.indexOf('/viewers/user/') !== -1,
          };
        });
        var json = JSON.stringify(payload);
        if (json === lastReport) return;   // 같은 목록을 반복해 보내지 않는다
        lastReport = json;
        send({ type: 'viewers.list', viewers: payload });
      }

      // 큰 파일용 **가상 스크롤**. `ctx.windowed` 인 파일에서 뷰어가 호출한다.
      //
      //   collaboViewers.virtualList(ctx, { className: 'hex-view' })
      //
      // 전체 줄 수만큼 높이를 잡아 두고(스크롤바가 파일 전체를 나타낸다) 화면에
      // 보이는 줄만 그린다. 줄은 `ctx.window(from, count)` 로 그때그때 받아 오고,
      // 아직 안 온 줄자리는 비워 뒀다가 도착하면 다시 그린다.
      function virtualList(ctx, opts) {
        opts = opts || {};
        var CHUNK = 200;      // 한 번에 받아 오는 줄 수(요청 횟수와 응답 크기의 절충)
        var OVERSCAN = 20;    // 화면 위아래로 미리 그려 두는 줄(스크롤 시 빈 칸 방지)
        var total = ctx.lineCount || 0;
        var chunks = Object.create(null);   // 청크 번호 → 줄 배열
        var asked = Object.create(null);

        var host = ctx.el;
        // 다시 그릴 때(검색 하이라이트·자동 갱신) 보던 위치를 잃지 않는다 —
        // 내용을 비우는 순간 스크롤이 0 으로 접히므로 미리 재 뒀다가 되돌린다.
        var keepTop = host.scrollTop;
        host.className = '';
        host.innerHTML = '';
        var body = document.createElement('div');
        body.className = 'vlist-body';
        var layer = document.createElement('pre');
        layer.className = 'vlist-layer' + (opts.className ? ' ' + opts.className : '');
        body.appendChild(layer);
        host.appendChild(body);

        // 줄 높이는 글꼴·테마·배율에 따라 달라지므로 **재서** 쓴다.
        var probe = document.createElement('pre');
        probe.className = 'vlist-probe';
        probe.textContent = 'X\nX\nX\nX\nX\nX\nX\nX\nX\nX';
        body.appendChild(probe);
        var lh = probe.getBoundingClientRect().height / 10;
        body.removeChild(probe);
        if (!lh || lh < 4) lh = 16;   // 측정 실패(숨겨진 패널 등) 대비
        // +8px: 마지막 줄이 바닥에 딱 붙지 않게(일반 뷰어의 아래 패딩과 같은 역할).
        body.style.height = Math.max(1, Math.round(total * lh) + 8) + 'px';
        if (keepTop) host.scrollTop = keepTop;

        function ensure(c) {
          if (chunks[c] || asked[c]) return;
          asked[c] = true;
          ctx.window(c * CHUNK, CHUNK).then(function (msg) {
            asked[c] = false;
            if (!msg || msg.error) return;
            chunks[c] = msg.lines || [];
            draw();
          });
        }

        function draw() {
          var first = Math.max(0, Math.floor(host.scrollTop / lh) - OVERSCAN);
          var last = Math.min(total,
            first + Math.ceil(host.clientHeight / lh) + OVERSCAN * 2);
          var out = [];
          for (var i = first; i < last; i++) {
            var c = Math.floor(i / CHUNK);
            var rows = chunks[c];
            if (!rows) { ensure(c); out.push(''); continue; }
            var line = rows[i - c * CHUNK];
            out.push(line == null ? '' : line);
          }
          layer.style.top = Math.round(first * lh) + 'px';
          layer.textContent = out.join('\n');
        }

        host.addEventListener('scroll', draw);
        // 다음 뷰어가 그려지기 전에 스크롤 구독을 반드시 끊는다(안 그러면 쌓인다).
        viewerCleanup = function () { host.removeEventListener('scroll', draw); };
        draw();
      }

      // 플러그인이 자기 폴더의 파일(주로 .wasm)을 바이트로 읽는다.
      //
      // 웹은 file:// 에서 fetch/XHR 을 못 쓰므로 WebAssembly.instantiateStreaming
      // 이 통하지 않는다 → 네이티브에 요청해 base64 로 받아 Uint8Array 로 준다.
      //   collaboViewers.asset('my-viewer', 'mod.wasm')
      //     .then(function (bytes) { return WebAssembly.instantiate(bytes); })
      // 요청은 **그 뷰어가 로드된 폴더 안**으로만 제한된다(네이티브가 검사).
      function asset(viewerId, name) {
        var v = null;
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === viewerId) { v = list[i]; break; }
        }
        if (!v || !v.src) {
          return Promise.reject(new Error('Unknown viewer: ' + viewerId));
        }
        return requestViewerAsset(v.src, name);
      }

      return {
        register: register,
        unregisterBySrc: unregisterBySrc,
        setRules: setRules,
        all: all, get: get,
        pick: pick, pickByExt: pickByExt,
        report: report, asset: asset, util: util,
        virtualList: virtualList,
      };
    })();

    // ===== 뷰어 에셋(wasm 등) 요청 =====
    // key = '<스크립트 URL>|<파일명>' → {resolve, reject}. 같은 요청은 합친다.
    var viewerAssetWaiters = Object.create(null);

    function requestViewerAsset(src, name) {
      var key = src + '|' + name;
      var pending = viewerAssetWaiters[key];
      if (pending) return pending.promise;
      var entry = {};
      entry.promise = new Promise(function (resolve, reject) {
        entry.resolve = resolve;
        entry.reject = reject;
      });
      viewerAssetWaiters[key] = entry;
      send({ type: 'viewer.asset', from: src, name: name });
      return entry.promise;
    }

    // ===== 압축 항목 미리보기 요청 (ctx.entry) =====
    // key = '<압축 경로>|<항목 이름>'.
    var archiveEntryWaiters = Object.create(null);

    // ===== 대용량 파일 줄 창 요청 (ctx.window) =====
    // key = '<경로>|<모드>|<시작 줄>|<줄 수>'.
    var fileWindowWaiters = Object.create(null);

    function requestArchiveEntry(path, name) {
      var key = path + '|' + name;
      var pending = archiveEntryWaiters[key];
      if (pending) return pending.promise;
      var entry = {};
      entry.promise = new Promise(function (resolve) { entry.resolve = resolve; });
      archiveEntryWaiters[key] = entry;
      send({ type: 'archive.entry', path: path, name: name });
      return entry.promise;
    }

    // 대용량 파일의 줄 창(window) 요청. 같은 요청이 이미 떠 있으면 그 약속을 함께 쓴다.
    // (스크롤이 빠르면 같은 구간을 여러 번 부르기 쉽다.)
    function requestFileWindow(path, mode, from, count) {
      var key = path + '|' + mode + '|' + from + '|' + count;
      var pending = fileWindowWaiters[key];
      if (pending) return pending.promise;
      var entry = { key: key };
      entry.promise = new Promise(function (resolve) { entry.resolve = resolve; });
      fileWindowWaiters[key] = entry;
      send({ type: 'file.window', path: path, mode: mode, from: from, count: count });
      return entry.promise;
    }

    function onFileWindowData(msg) {
      // 응답에는 요청한 개수가 없다(끝에서 잘릴 수 있다) → 앞부분이 같은 요청을 모두 깨운다.
      var prefix = (msg.path || '') + '|' + (msg.mode || '') + '|' + (msg.from || 0) + '|';
      Object.keys(fileWindowWaiters).forEach(function (key) {
        if (key.indexOf(prefix) !== 0) return;
        var entry = fileWindowWaiters[key];
        delete fileWindowWaiters[key];
        entry.resolve(msg);
      });
    }

    function onArchiveEntryData(msg) {
      var key = (msg.path || '') + '|' + (msg.name || '');
      var entry = archiveEntryWaiters[key];
      if (!entry) return;
      delete archiveEntryWaiters[key];
      // 오류도 그대로 넘긴다 — 뷰어가 그 자리에 이유를 보여 준다.
      entry.resolve(msg);
    }

    function onViewerAssetData(msg) {
      var key = (msg.from || '') + '|' + (msg.name || '');
      var entry = viewerAssetWaiters[key];
      if (!entry) return;
      delete viewerAssetWaiters[key];
      if (msg.error) { entry.reject(new Error(msg.error)); return; }
      try {
        // base64 → Uint8Array. atob 는 바이너리 문자열을 주므로 바이트로 옮긴다.
        var bin = atob(msg.b64 || '');
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        entry.resolve(bytes);
      } catch (e) {
        entry.reject(e);
      }
    }

    // 네이티브가 뷰어 설정을 밀어 준다: {rules:{id:{enabled,extensions}}, order:[id…]}.
    window.collaboSetViewerRules = function (cfg) {
      cfg = cfg || {};
      collaboViewers.setRules(cfg.rules || {}, cfg.order || []);
      reportState();
      // 보고 있던 뷰어를 꺼 버렸으면 다시 열어 자동 선택으로 되돌린다.
      if (currentFilePath && !collaboViewers.get(currentViewerId)) {
        openFile(currentFilePath);
      }
    };

    // 뷰어 파일 주입. 레지스트리가 만들어진 뒤여야 하므로 여기서 로드한다.
    // 파일 하나가 깨져도 나머지 뷰어는 살아 있게 개별로 처리한다.
    var viewersReady = (function () {
      var files = window.COLLABO_VIEWER_FILES || [];
      return Promise.all(files.map(function (f) {
        return new Promise(function (resolve) {
          var s = document.createElement('script');
          s.src = './viewers/' + f;
          s.onload = function () { resolve(); };
          s.onerror = function () {
            console.warn('[viewer] 로드 실패:', f);
            resolve(); // 실패해도 나머지 진행
          };
          document.head.appendChild(s);
        });
      }));
    })();

    // ===== 사용자 뷰어(설정 → 도구 → 파일 뷰어) =====
    // 네이티브가 사용자 JS 를 웹 루트(viewers/user/)로 복사한 뒤,
    // collaboSyncUserViewers(['./viewers/user/x.js', …]) 로 현재 목록을 넘긴다.
    // 무엇을 새로 얹고 무엇을 내릴지는 여기서 판단한다(로드 상태는 웹만 안다).
    var userViewerUrls = Object.create(null);   // 정규 URL → <script> 엘리먼트

    // 뷰어 스크립트 하나를 얹는다. 같은 파일을 다시 얹으면 먼저 내린다(재적용).
    // 반환: 로드가 끝나면(성공/실패 모두) 이행되는 Promise.
    function loadViewerScript(url) {
      var key = normViewerUrl(url);
      if (userViewerUrls[key]) unloadViewerScript(key);
      return new Promise(function (resolve) {
        var s = document.createElement('script');
        // 파일 내용이 바뀌어도 다시 읽히도록 캐시를 무효화한다(경로는 그대로다).
        s.src = url + (url.indexOf('?') === -1 ? '?v=' : '&v=') + Date.now();
        s.onload = function () { reportState(); resolve(); };
        s.onerror = function () {
          console.warn('[viewer] 사용자 뷰어 로드 실패:', url);
          delete userViewerUrls[key];
          resolve();
        };
        userViewerUrls[key] = s;
        document.head.appendChild(s);
      });
    }

    // 여러 개를 **차례로** 얹는다. 이유 둘:
    //  1) 여러 파일로 된 뷰어(viewer.json 의 scripts → entry)는 순서가 곧 의존성이다.
    //  2) 등록 순서가 기본 우선순위이므로, 병렬로 로드하면 실행마다 순서가 흔들린다.
    function loadViewerScriptsInOrder(urls) {
      return urls.reduce(function (chain, url) {
        return chain.then(function () { return loadViewerScript(url); });
      }, Promise.resolve());
    }

    // 이미 실행된 스크립트를 되돌릴 수는 없지만, 그 스크립트가 등록한 뷰어를
    // 레지스트리에서 빼면 드롭다운·자동 선택 대상에서 사라진다.
    function unloadViewerScript(key) {
      var s = userViewerUrls[key];
      if (s && s.parentNode) s.parentNode.removeChild(s);
      delete userViewerUrls[key];
      return collaboViewers.unregisterBySrc(key) > 0;
    }

    window.collaboSyncUserViewers = function (urls) {
      var list = urls || [];
      var want = Object.create(null);
      list.forEach(function (u) { want[normViewerUrl(u)] = u; });
      var dropped = false;
      // 1) 설정에서 빠진 뷰어 내리기. 이 함수가 얹은 것만 대상이다
      //    (번들 뷰어는 건드리지 않는다).
      Object.keys(userViewerUrls).forEach(function (key) {
        if (!want[key]) dropped = unloadViewerScript(key) || dropped;
      });
      // 2) 새로 추가된 뷰어를 **넘어온 순서대로** 얹기(순서 = 의존성 + 우선순위).
      loadViewerScriptsInOrder(list.filter(function (u) {
        return !userViewerUrls[normViewerUrl(u)];
      }));
      reportState();
      // 지금 보고 있던 뷰어가 사라졌으면 다시 열어 자동 선택으로 되돌린다.
      if (dropped && currentFilePath && !collaboViewers.get(currentViewerId)) {
        openFile(currentFilePath);
      }
    };

    // 뷰어 하나만 런타임에 붙일 때 쓰는 진입점(수동/디버그용).
    window.collaboLoadViewer = function (url) { loadViewerScript(url); };

    // ===== 뷰어 편집기의 저장 (ctx.save) =====
    // 웹은 파일시스템에 직접 접근하지 않는다 — 쓰기도 네이티브(file.save)가 한다.
    var suppressReloadUntil = Object.create(null);   // path → timestamp
    var saveWaiters = [];                            // {path, done}

    function requestFileSave(path, text, done) {
      if (!path) return;
      if (typeof done === 'function') saveWaiters.push({ path: path, done: done });
      // 저장 → 감시자 이벤트가 곧 돌아온다. 그 자동 갱신만 잠깐 막는다.
      suppressReloadUntil[path] = Date.now() + 2000;
      send({ type: 'file.save', path: path, content: text });
    }

    function onFileSaved(msg) {
      var ok = !!msg.ok;
      if (!ok) delete suppressReloadUntil[msg.path];
      saveWaiters = saveWaiters.filter(function (w) {
        if (w.path !== msg.path) return true;
        try { w.done(ok, msg.message || ''); } catch (e) { console.error(e); }
        return false;
      });
      // 실패는 틀의 알림 줄로 알린다(예전엔 대화창에 한 줄이었다).
      if (!ok) {
        currentNotice = T('saveFailed', '저장하지 못했습니다') + ': ' + (msg.message || '');
        reportState();
      }
    }

    // ===== 파일 뷰어 =====
    var currentFilePath = null;
    var currentViewerId = null;   // 지금 그리고 있는 뷰어 플러그인
    var pendingViewerId = null;   // 틀의 드롭다운에서 고른 뷰어(응답 대기 중)
    // 응답을 기다리는 경로. 압축처럼 읽는 데 시간이 걸리는 형식이 있어서,
    // ① 대기 중임을 알리고 ② 늦게 도착한 결과(다른 파일로 옮긴 뒤)를 버리는 데 쓴다.
    var pendingOpenPath = null;
    var pendingOpenTimer = null;
    var currentSize = 0;
    var currentTruncated = false;
    var currentWindowed = false;   // 창(window) 단위로 이어 읽을 수 있는 파일인가
    var currentLineCount = 0;      // 전체 줄 수(hex 는 16바이트 = 한 줄)
    var viewerRaw = '';            // 현재 파일 원본(복사·검색 하이라이트 복원용)
    var currentNotice = '';        // 틀의 알림 줄(대용량 안내 · 저장 실패)
    var currentError = '';         // 열기 실패
    var searchQuery = '';          // 틀의 검색창(다시 그려도 하이라이트를 되살린다)
    var viewerEl = document.getElementById('viewer');

    var viewerReloadTimer = null;
    var viewerAutoReloading = false;
    /// 자동 갱신 직전의 스크롤. `{path, top}` — 같은 파일이 다시 그려진 뒤에만 되돌린다.
    var viewerKeepScroll = null;

    /// 틀(네이티브)에 지금 상태를 알린다: 어떤 파일을, 어느 뷰어로, 후보는 무엇, 알림/오류.
    /// 드롭다운은 이 후보 목록으로만 그려진다 — 레지스트리는 여기(웹)에 있다.
    function reportState(extra) {
      collaboViewers.report();   // 등록 상태가 바뀌었으면 설정 화면에도(같은 목록은 걸러진다)
      var st = {
        type: 'viewer.state',
        path: pendingOpenPath || currentFilePath,
        viewerId: pendingOpenPath ? (pendingViewerId || currentViewerId) : currentViewerId,
        viewers: collaboViewers.all().map(function (v) { return { id: v.id, label: v.label }; }),
        notice: currentNotice,
        loading: !!pendingOpenPath,
        error: currentError,
      };
      if (extra) Object.keys(extra).forEach(function (k) { st[k] = extra[k]; });
      send(st);
    }

    function showEmpty() {
      viewerEl.className = 'p-2';
      viewerEl.innerHTML = '<div class="text-secondary small viewer-msg"></div>';
      viewerEl.firstChild.textContent = T('viewerEmpty', '선택한 파일 내용이 여기에 표시됩니다.');
    }

    function clearViewer() {
      clearPendingOpen();
      if (viewerReloadTimer) { clearTimeout(viewerReloadTimer); viewerReloadTimer = null; }
      if (viewerCleanup) { try { viewerCleanup(); } catch (e) {} viewerCleanup = null; }
      currentFilePath = null; currentViewerId = null; pendingViewerId = null;
      viewerRaw = ''; currentSize = 0; currentTruncated = false;
      currentWindowed = false; currentLineCount = 0;
      currentNotice = ''; currentError = '';
      viewerKeepScroll = null;
      showEmpty();
      reportState({ cleared: true });
    }

    // 현재 뷰어 플러그인으로 본문을 다시 그린다(검색 하이라이트는 제거됨).
    function renderViewer() {
      // 직전 뷰어가 걸어 둔 구독을 먼저 끊는다(가상 스크롤 리스너가 쌓이지 않게).
      if (viewerCleanup) {
        try { viewerCleanup(); } catch (e) { /* 무시 */ }
        viewerCleanup = null;
      }
      var v = collaboViewers.get(currentViewerId);
      if (!v) {
        viewerEl.className = '';
        var pre = document.createElement('pre');
        pre.textContent = viewerRaw;
        viewerEl.innerHTML = '';
        viewerEl.appendChild(pre);
        return;
      }
      try {
        var path = currentFilePath;
        v.render({
          el: viewerEl,
          content: viewerRaw,
          path: path,
          size: currentSize,
          truncated: currentTruncated,
          util: collaboViewers.util,
          windowed: currentWindowed,
          lineCount: currentLineCount,
          window: function (from, count) {
            return requestFileWindow(path, v.dataMode, from, count);
          },
          // 열려 있던 그 파일에만 쓴다(늦게 도착한 저장이 엉뚱한 파일을 덮지 않게).
          save: function (text, done) { requestFileSave(path, text, done); },
          entry: function (name) { return requestArchiveEntry(path, name); },
        });
      } catch (e) {
        // 확장(플러그인)이 터져도 앱은 살아 있어야 한다 — 오류만 표시한다.
        console.error('[viewer] render 실패:', v.id, e);
        viewerEl.className = 'p-3';
        viewerEl.innerHTML = '<div class="text-danger small viewer-msg"></div>';
        viewerEl.firstChild.textContent =
          T('viewerRenderError', '뷰어 오류') + ' (' + v.id + '): ' + e;
      }
    }

    // 내용에서 검색어를 <mark> 로 하이라이트. 빈 검색어면 복원만.
    // ⚠️ 가상 스크롤이면 화면 밖 줄은 DOM 에 없다 — 보이는 부분에만 걸린다.
    function applyViewerSearch(query) {
      if (!currentFilePath) return;
      renderViewer();
      var q = (query || '').trim();
      if (!q) return;
      var lower = q.toLowerCase();
      var walker = document.createTreeWalker(viewerEl, NodeFilter.SHOW_TEXT, null);
      var targets = [];
      var n;
      while ((n = walker.nextNode())) {
        if (n.nodeValue.toLowerCase().includes(lower)) targets.push(n);
      }
      var first = null;
      targets.forEach(function (node) {
        var text = node.nodeValue;
        var frag = document.createDocumentFragment();
        var i = 0, idx;
        var low = text.toLowerCase();
        while ((idx = low.indexOf(lower, i)) !== -1) {
          if (idx > i) frag.appendChild(document.createTextNode(text.slice(i, idx)));
          var mark = document.createElement('mark');
          mark.textContent = text.slice(idx, idx + q.length);
          if (!first) first = mark;
          frag.appendChild(mark);
          i = idx + q.length;
        }
        if (i < text.length) frag.appendChild(document.createTextNode(text.slice(i)));
        node.parentNode.replaceChild(frag, node);
      });
      if (first) first.scrollIntoView({ block: 'center' });
    }

    // [viewerId] 를 주면 그 뷰어가 요구하는 형태(dataMode)로 읽어 달라고 요청한다.
    // 안 주면 **확장자를 담당하는 뷰어**(설정 반영)의 형태로, 담당이 없으면 네이티브가
    // 확장자/바이너리 판정으로 고른다. 어느 쪽이든 도착한 형태에 맞춰 뷰어가 고정된다.
    function openFile(path, viewerId) {
      if (!path) return;
      // 다른 파일로 이동하면 대기 중인 자동 갱신은 취소.
      if (viewerReloadTimer) { clearTimeout(viewerReloadTimer); viewerReloadTimer = null; }
      viewersReady.then(function () {
        var v = viewerId ? collaboViewers.get(viewerId) : collaboViewers.pickByExt(path);
        pendingViewerId = v ? v.id : null;
        var m = { type: 'file.open', path: path };
        if (v) m.mode = v.dataMode;
        pendingOpenPath = path;
        currentError = '';
        if (path !== currentFilePath) currentNotice = '';
        // 읽는 중 표시: 바로 띄우면 작은 파일에서 깜빡이므로 조금 기다린다.
        if (pendingOpenTimer) clearTimeout(pendingOpenTimer);
        pendingOpenTimer = setTimeout(function () {
          pendingOpenTimer = null;
          if (pendingOpenPath !== path || viewerAutoReloading) return;
          viewerEl.className = 'p-3';
          viewerEl.innerHTML = '<div class="text-secondary small viewer-msg"></div>';
          viewerEl.firstChild.textContent = T('viewerLoading', '파일을 읽는 중입니다…');
        }, 150);
        reportState();
        send(m);
      });
    }

    /// 응답 대기 상태를 끝낸다(도착/오류/뷰어 닫기).
    function clearPendingOpen() {
      if (pendingOpenTimer) { clearTimeout(pendingOpenTimer); pendingOpenTimer = null; }
      pendingOpenPath = null;
    }

    function onFileContent(msg) {
      viewersReady.then(function () { renderFileContent(msg); });
    }

    function renderFileContent(msg) {
      // 다른 파일로 옮긴 뒤 늦게 도착한 결과는 버린다(압축 해독처럼 느린 읽기).
      if (pendingOpenPath && msg.path !== pendingOpenPath) return;
      clearPendingOpen();
      viewerAutoReloading = false;
      currentFilePath = msg.path;
      viewerRaw = msg.content || '';
      currentSize = msg.size || 0;
      currentTruncated = !!msg.truncated;
      currentWindowed = !!msg.windowed;
      currentLineCount = msg.lineCount || 0;
      currentError = '';

      // 네이티브의 읽기 모드('text'|'hex'|'md'|'archive')를 뷰어의 dataMode 로 환원한다.
      // ⚠️ 네이티브에 읽기 모드를 추가하면 DATA_MODES 도 같이 늘릴 것(§13).
      var dataMode = DATA_MODES.indexOf(msg.mode) !== -1 ? msg.mode : 'text';
      var v = pendingViewerId ? collaboViewers.get(pendingViewerId) : null;
      // 고른 뷰어가 이 데이터 형태와 안 맞으면 자동 선택으로 되돌린다.
      if (!v || v.dataMode !== dataMode) v = collaboViewers.pick(msg.path, dataMode);
      currentViewerId = v ? v.id : null;
      pendingViewerId = null;

      // 압축은 `truncated` 가 "목록이 잘렸다" 는 뜻이라 여기선 띄우지 않는다(뷰어가 안내).
      if (msg.truncated && dataMode !== 'archive') {
        currentNotice = (currentWindowed
            ? T('windowed', '대용량 파일: 보이는 부분만 읽으므로 저장할 수 없습니다')
            : T('truncated', '대용량 파일: 앞부분만 표시합니다')) +
          ' (' + formatSize(msg.size) + ')';
      } else {
        currentNotice = '';
      }
      renderViewer();
      reportState();
      // 자동 갱신이었으면 읽던 자리로 되돌린다(뷰어가 비동기로 채울 수 있어 한 프레임 뒤).
      if (viewerKeepScroll && viewerKeepScroll.path === msg.path) {
        var top = viewerKeepScroll.top;
        viewerKeepScroll = null;
        if (top) requestAnimationFrame(function () { viewerEl.scrollTop = top; });
      } else {
        viewerKeepScroll = null;
      }
      if (searchQuery.trim()) applyViewerSearch(searchQuery);
    }

    function onFileError(msg) {
      if (pendingOpenPath && msg.path && msg.path !== pendingOpenPath) return;
      clearPendingOpen();
      // 자동 갱신 중 파일이 사라진(삭제/이동) 경우엔 오류 대신 뷰어를 닫는다.
      if (viewerAutoReloading) {
        viewerAutoReloading = false;
        clearViewer();
        return;
      }
      viewerKeepScroll = null;
      currentFilePath = msg.path || currentFilePath;
      currentError = msg.message || 'error';
      viewerEl.className = 'p-3';
      viewerEl.innerHTML = '<div class="text-danger small viewer-msg">' +
        esc(T('fileOpenError', '파일을 열 수 없습니다: ')) + esc(msg.message || '') + '</div>';
      reportState();
    }

    // 파일이 바뀌었다(감시자). 보고 있는 파일이면 잠깐 모았다가 **같은 뷰어로** 다시 읽는다.
    function onFsChange(files) {
      if (!currentFilePath || files.indexOf(currentFilePath) === -1) return;
      // 방금 저장한 변경이면 다시 읽지 않는다 — 편집기가 갈아치워지면 커서가 날아간다.
      if (suppressReloadUntil[currentFilePath] > Date.now()) return;
      if (viewerReloadTimer) clearTimeout(viewerReloadTimer);
      viewerReloadTimer = setTimeout(function () {
        viewerReloadTimer = null;
        if (!currentFilePath) return;
        viewerAutoReloading = true;
        // ★ 읽던 자리를 기억한다 — 에이전트가 도는 동안 PLAYBOOK.md 같은 파일은 몇 초마다
        // 바뀌는데, 그때마다 맨 위로 튀면 읽을 수가 없다.
        viewerKeepScroll = { path: currentFilePath, top: viewerEl.scrollTop };
        openFile(currentFilePath, currentViewerId);
      }, 800);
    }

    // 선택 영역 복사(선택이 없으면 전체). 클립보드는 네이티브가 쓴다.
    function copySelection() {
      var sel = window.getSelection();
      var text = (sel && sel.toString() && viewerEl.contains(sel.anchorNode))
        ? sel.toString() : viewerRaw;
      if (text) send({ type: 'clipboard.write', text: text });
    }

    // ===== 링크는 무조건 외부 브라우저로 (뷰어 페이지가 링크로 바뀌지 않게) =====
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]');
      if (!a) return;
      e.preventDefault();
      var href = a.getAttribute('href') || '';
      if (/^(https?:|mailto:)/i.test(href)) send({ type: 'open.external', url: a.href });
    }, true);

    // Esc — 전체화면은 틀(네이티브)의 것이다. 초점이 웹뷰에 있으면 여기로 온다.
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') send({ type: 'viewer.escape' });
    });

    showEmpty();
    viewersReady.then(function () { reportState({ cleared: true }); });
    send({ type: 'ready' });
  </script>
</body>
</html>
